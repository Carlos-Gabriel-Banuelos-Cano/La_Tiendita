<app-barra></app-barra>
<div class="contenido">
    <h1>{{ usuarioIndex !== null ? 'Editar Usuario' : 'Nuevo Usuario' }}</h1>
    <form id="form-usuario" #form="ngForm" (ngSubmit)="agregarOEditarUsuario(form)">
        
        <div class="form-group">
            <label for="nombreUsuario">Nombre de Usuario:</label>
            <input type="text" id="nombreUsuario" name="nombreUsuario" 
                [(ngModel)]="nombreUsuario" 
                #nombreUsuarioRef="ngModel"
                pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ ]{3,25}$"
                required />
            <div *ngIf="nombreUsuarioRef.invalid && nombreUsuarioRef.touched">
                <small class="text-danger">El nombre debe tener entre 3 y 25 caracteres y solo letras.</small>
            </div>
        </div>

        <div class="form-group">
            <label for="correo">Correo:</label>
            <input type="email" id="correo" name="correo" 
                [(ngModel)]="correo1" 
                #correoRef="ngModel"
                required />
            <div *ngIf="correoRef.invalid && correoRef.touched">
                <small class="text-danger">Ingrese un correo válido.</small>
            </div>
        </div>

        <div class="form-group">
            <label for="contrasena">Contraseña:</label>
            <input type="password" id="contrasena" name="contrasena" 
                [(ngModel)]="contrasena1" 
                #contrasenaRef="ngModel"
                required minlength="6" maxlength="20"/>
            <div *ngIf="contrasenaRef.invalid && contrasenaRef.touched">
                <small class="text-danger">La contraseña debe tener al menos 6 caracteres.</small>
            </div>
        </div>

        <div class="btn-agregar">
            <button type="submit" [disabled]="form.invalid">
                {{ usuarioIndex !== null ? 'Actualizar' : 'Agregar' }}
            </button>
        </div>
    </form>
    
</div>
