<app-barra></app-barra>
<div class="contenido">
    <h1>Usuarios</h1>
    <p>Gestión de usuarios</p>
    <div class="btn-agregar">
        <a href="/tiendita/registro-usuarios">
            <button><i class="fa fa-plus"></i> Agregar Usuario</button>
        </a>
    </div>
    <table>
        <thead>
            <tr>
                <th>Nombre de Usuario</th>
                <th>Correo</th>
                <th>Contraseña</th>
                <th>Operaciones</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let usuario of usuarios; let i = index">
                <td>{{ usuario.nombreUsuario }}</td>
                <td>{{ usuario.correo }}</td>
                <td>{{ usuario.contrasena1 }}</td>
                <td>
                    <button class="editar" 
                    (click)="editarUsuario(i)" 
                    [disabled]="editando">Editar</button>
                                        <button class="eliminar" (click)="confirmarEliminacion(i)">Eliminar</button>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Formulario de edición -->
    <div *ngIf="editIndex !== null" class="form-edicion">
        <h2>Editar Usuario</h2>
        <form (ngSubmit)="guardarEdicion()">
            <div class="form-group">
                <label>Nombre de Usuario:</label>
                <input type="text" [(ngModel)]="usuarioEditando.nombreUsuario" name="nombreUsuario" required>
            </div>
            <div class="form-group">
                <label>Correo:</label>
                <input type="email" [(ngModel)]="usuarioEditando.correo" name="correo" required>
            </div>
            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" [(ngModel)]="usuarioEditando.contrasena1" name="contrasena1" required>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn-guardar">Guardar Cambios</button>
                <button type="button" class="btn-cancelar" (click)="cancelarEdicion()">Cancelar</button>
            </div>
        </form>
    </div>
</div>
