<app-barra></app-barra>
<div class="contenido">
    <h1>Nuevo Producto</h1>
    <form id="form-producto" (ngSubmit)="agregarProducto()" #productoForm="ngForm">
        <div class="form-group">
            <label for="nombreProducto">Nombre del Producto:</label>
            <input type="text" id="nombreProducto" name="nombreProducto" 
                [(ngModel)]="producto.nombre" 
                #nombreProducto="ngModel"
                pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ0-9 ]{1,25}$"
                required>
            <div class="error" *ngIf="nombreProducto.invalid && nombreProducto.touched">
                <span *ngIf="nombreProducto.errors?.['required']">El nombre es obligatorio.</span>
                <span *ngIf="nombreProducto.errors?.['pattern']">Solo letras, números y espacios (máx. 25 caracteres).</span>
            </div>
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción:</label>
            <input type="text" id="descripcion" name="descripcion" 
                [(ngModel)]="producto.descripcion" 
                #descripcion="ngModel"
                pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ0-9,. ]{1,100}$"
                required>
            <div class="error" *ngIf="descripcion.invalid && descripcion.touched">
                <span *ngIf="descripcion.errors?.['required']">La descripción es obligatoria.</span>
                <span *ngIf="descripcion.errors?.['pattern']">Formato incorrecto (máx. 100 caracteres).</span>
            </div>
        </div>

        <div class="form-group">
            <label for="precio">Precio:</label>
            <input type="number" id="precio" name="precio" 
                [(ngModel)]="producto.precio" 
                #precio="ngModel"
                min="0" step="0.01"
                required>
            <div class="error" *ngIf="precio.invalid && precio.touched">
                <span *ngIf="precio.errors?.['required']">El precio es obligatorio.</span>
                <span *ngIf="precio.errors?.['min']">El precio no puede ser negativo.</span>
            </div>
        </div>

        <div class="form-group">
            <label for="cantidad">Cantidad:</label>
            <input type="number" id="cantidad" name="cantidad" 
                [(ngModel)]="producto.cantidad" 
                #cantidad="ngModel"
                min="1"
                required>
            <div class="error" *ngIf="cantidad.invalid && cantidad.touched">
                <span *ngIf="cantidad.errors?.['required']">La cantidad es obligatoria.</span>
                <span *ngIf="cantidad.errors?.['min']">Debe ser al menos 1.</span>
            </div>
        </div>

        <div class="btn-agregar">
            <button type="submit" [disabled]="productoForm.invalid">Agregar</button>
            <button type="button" class="btn-cancelar" (click)="cancelar()">Cancelar</button>
        </div>
    </form>
</div>
