<ion-header class="cabecera">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/perfil"></ion-back-button> 
    </ion-buttons>
    <ion-title>Comentarios</ion-title>
    <div class="logo-contenedor">
      <img src="assets/img/Logo tienda.png" alt="Logo Tiendita" class="logo-img">
    </div>
  </ion-toolbar>
</ion-header>


<ion-content class="ion-padding">
  <form [formGroup]="comentarioForm" (ngSubmit)="enviarComentario()">
    <ion-item>
      <ion-label position="floating">Nombre</ion-label>
      <ion-input formControlName="nombre"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Correo Electrónico</ion-label>
      <ion-input type="email" formControlName="correo"></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="correoInvalido()">Correo inválido</ion-text>

    <ion-item>
      <ion-label position="floating">Teléfono</ion-label>
      <ion-input type="tel" formControlName="telefono"></ion-input>
    </ion-item>
    <ion-text color="danger" *ngIf="telefonoInvalido()">Teléfono inválido</ion-text>

    <ion-item>
      <ion-label position="floating">Asunto</ion-label>
      <ion-textarea formControlName="comentario"></ion-textarea>
    </ion-item>

    <ion-button expand="full" type="submit" [disabled]="comentarioForm.invalid">
      Enviar Comentario
    </ion-button>
  </form>
</ion-content>
